name: CI

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]

# If you push again while CI is still running on the same branch, cancel the old run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres runs next to the job, like your docker-compose service
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ccr
          POSTGRES_PASSWORD: ccr_ci_password
          POSTGRES_DB: ccr_website
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccr -d ccr_website"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ccr:ccr_ci_password@localhost:5432/ccr_website

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Database smoke test
        run: psql "$DATABASE_URL" -c "select version();"
